name: Offline profile Windows installer (unsigned)

on:
  push:
    branches: [offline-profiles]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: offline-wardrobe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  POLYPLUS_REVISION: 462663858973b1298bc30820e707854997fcffe4

jobs:
  appearance-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check validated component source fingerprint
        id: source
        shell: bash
        run: |
          if [[ "$POLYPLUS_REVISION" == "462663858973b1298bc30820e707854997fcffe4" && "$(git hash-object distribution/local-appearance/polyplus.patch)" == "cc497562588af38f32a8a079b43341071bbeb4a1" ]]; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse component that passed build, tests and lint
        id: reuse
        if: steps.source.outputs.validated == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: local-appearance-1.8.9
          run-id: 45891179104
          github-token: ${{ github.token }}
          path: appearance-output
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.reuse.outcome != 'success'
        with:
          repository: Polyfrost/PolyPlus
          ref: ${{ env.POLYPLUS_REVISION }}
          path: polyplus-src
      - uses: actions/setup-java@v5
        if: steps.reuse.outcome != 'success'
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        if: steps.reuse.outcome != 'success'
        with:
          cache-read-only: false
      - name: Apply local wardrobe source changes
        if: steps.reuse.outcome != 'success'
        working-directory: polyplus-src
        run: git apply ../distribution/local-appearance/polyplus.patch
      - name: Build and test OneClient 1.8.9 component
        if: steps.reuse.outcome != 'success'
        working-directory: polyplus-src
        run: bash ./gradlew ':1.8.9-ornithe:build' --no-daemon -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4G -Pkotlin.daemon.jvmargs=-Xmx3G
      - name: Collect component
        if: steps.reuse.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p appearance-output
          mapfile -t jars < <(find polyplus-src/versions/1.8.9-ornithe/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" appearance-output/local-appearance-1.8.9.jar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-appearance-1.8.9
          path: appearance-output/local-appearance-1.8.9.jar
          if-no-files-found: error
          retention-days: 14
  installer:
    needs: appearance-mod
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: true
          cache-namespace: offline-windows-cache

      - name: Download bundled local wardrobe component
        uses: actions/download-artifact@v8
        with:
          name: local-appearance-1.8.9
          path: packages/oneclient_core/assets

      - name: Test avatar redraw stability and visible skin changes
        run: cargo test --locked --release -p oneclient_avatar_cache_tests --lib

      - name: Prove the avatar tests detect the previous redraw loop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $path = 'packages/oneclient_app/src/components/avatar_cache.rs'
          $source = [IO.File]::ReadAllText($path)
          if (-not $source.Contains('png == skin_bytes')) { throw 'Missing production cache comparison.' }
          try {
            $regression = $source.Replace('png == skin_bytes', 'png.as_ptr() == skin_bytes.as_ptr()')
            [IO.File]::WriteAllText($path, $regression, [Text.UTF8Encoding]::new($false))
            $output = & cargo test --locked --release -p oneclient_avatar_cache_tests --lib fresh_png_allocations_settle_without_repainting_forever -- --nocapture 2>&1
            $result = $LASTEXITCODE
            $output | Write-Output
            if ($result -eq 0 -or ($output -join "`n") -notmatch 'same skin requested unbounded renders' -or ($output -join "`n") -notmatch 'test result:.*FAILED') {
              throw 'The previous redraw loop was not reproduced by the regression test.'
            }
          } finally {
            [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))
          }
          git diff --exit-code -- $path
          if ($LASTEXITCODE -ne 0) { throw 'Production avatar source was not restored.' }
          cargo test --locked --release -p oneclient_avatar_cache_tests --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test authentication and offline profiles
        run: cargo test --locked -p oneclient_auth

      - name: Test local PNG validation
        run: cargo test --locked -p oneclient_core --features local-appearance offline_appearance::tests

      - name: Build launcher
        run: cargo build --locked --release --bin oneclient_app --features local-appearance

      - name: Stage app-local Visual C++ runtime
        run: python distribution/windows/bundle-crt.py

      - name: Verify runtime signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dlls = @(Get-ChildItem 'target/crt/*.dll')
          if ($dlls.Count -eq 0) { throw 'No Visual C++ runtime DLLs were staged.' }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw "Invalid Microsoft signature on $($dll.Name)."
            }
          }

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Package unsigned Windows installer
        env:
          CI: 'true'
        run: cargo packager --release --formats nsis --verbose

      - name: Verify installer layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'target/release/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $dest = Join-Path $env:RUNNER_TEMP 'oneclient-offline-smoke'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $dest 'oneclient_app.exe'))) {
            throw 'The installed launcher executable is missing.'
          }
          foreach ($dll in @(Get-ChildItem 'target/crt/*.dll')) {
            if (-not (Test-Path (Join-Path $dest $dll.Name))) {
              throw "Installed runtime DLL $($dll.Name) is missing."
            }
          }
          Get-FileHash $installers[0].FullName -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oneclient-offline-windows-x64-installer
          path: target/release/*-setup.exe
          if-no-files-found: error
          retention-days: 14
